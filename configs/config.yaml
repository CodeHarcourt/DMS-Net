# DMS-Net training configuration file.

# Data pipeline settings.
data:
  train_csv: "data/train_set_light_cutmix_v1.csv"
  val_csv: "data/val_set_light_cutmix_v1.csv"
  data_root: "data/raw"
  num_classes: 8
  image_size: 512

# Training hyperparameters.
training:
  batch_size: 16
  num_epochs: 50
  learning_rate: 0.0001
  accumulation_steps: 4
  num_workers: 4

# Model settings.
model:
  name: "DualEfficientNet"
  num_classes: 8
  pretrained: true

# Image transforms / augmentations.
transforms:
  normalize:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

# Loss function.
loss:
  type: "BCEWithLogitsLoss"

# Optimizer configuration.
optimizer:
  type: "Adam"
  params:
    lr: 0.0001
    weight_decay: 0.0001

# Checkpoint saving settings.
checkpoint:
  save_dir: "checkpoints"
  save_best: true
  save_frequency: 25   # Checkpoint interval in epochs.
  metric: "recall"     # Metric used to select the best checkpoint.
